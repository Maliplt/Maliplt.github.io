<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yün Atölyesi</title>
<meta name="description" content="Yün Atölyesi: Örgü Bulmaca – renkli yumakları sırala, ilmek ilmek resim ör.">
<style>
  :root { --bg: #24152A; --card: #2E2230; --ink: #FFF1E4; --soft: #D2BFB7; --accent: #EC6F96; }
  body { margin: 0; background: radial-gradient(circle at 50% 20%, #5A2366, var(--bg) 70%); background-color: var(--bg);
    color: var(--ink); font: 17px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  img { width: 180px; height: 180px; border-radius: 40px; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  h1 { font-size: 34px; margin: 26px 0 4px; }
  p { color: var(--soft); }
  .links { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  a { color: var(--ink); background: var(--card); padding: 12px 22px; border-radius: 999px; text-decoration: none;
    min-width: 240px; }
  a:hover { background: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="yun-atolyesi/icon.png" alt="Yün Atölyesi ikonu">
  <h1>Yün Atölyesi</h1>
  <p>Renkli yumakları doğru sırayla şişlere gönder, ilmek ilmek gerçek bir resim ör!<br>
  Sort the yarn, knit the picture – a relaxing knitting puzzle for iPhone.</p>
  <div class="links">
    <a href="yun-atolyesi/privacy/">Gizlilik Politikası · Privacy Policy</a>
    <a href="https://github.com/Maliplt/Maliplt.github.io/issues">Destek · Support</a>
  </div>
</main>
</body>
</html>
